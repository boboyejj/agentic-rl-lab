# Expert list for the zeolite-synthesis corpus. Copy to experts.toml (keep that file private).
#
# These are CANDIDATES chosen from the published literature on the themes below. Names and
# institution hints are starting points only: affiliations change, and OpenAlex may split one
# person into several profiles. Run `build_expert_corpus.py resolve`, check each candidate, then
# paste every correct OpenAlex author ID into openalex_ids (or set orcid).
#
# consent:  "published-only" (the only mode used in this personal project): we use their
#           published, attributed work only. Nobody on this list is contacted.
#
# Tiers (section 2 of expert-distillation.md):
#   tier 1 = authors whose published work is closest to yours (incl. your own papers, if any)
#   tier 2 = core field leaders on your exact themes
#   tier 3 = adjacent expertise you want the agent to "think like" for specific dimensions

[settings]
from_year = 2000

